<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RJC Mobile QA</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171817;color:#fff;font-family:system-ui,sans-serif}
  body{display:grid;place-items:center}
  #stage{position:relative;transform-origin:center center}
  iframe{display:block;border:1px solid rgba(255,255,255,.18);background:#0d0e0c;box-shadow:0 24px 70px rgba(0,0,0,.45)}
  #meta{position:fixed;left:10px;top:8px;font:11px/1.4 ui-monospace,monospace;color:#9ea39d;z-index:3}
</style>
</head>
<body>
<div id="meta"></div>
<div id="stage"><iframe id="frame"></iframe></div>
<script>
(async()=>{
 const p=new URLSearchParams(location.search);
 const w=Math.max(280,Math.min(1200,Number(p.get('w'))||390));
 const h=Math.max(480,Math.min(1400,Number(p.get('h'))||844));
 const hash=p.get('hash')||'';
 const y=Number(p.get('y')||0);
 const motion=p.get('motion')==='reduce';
 const loader=p.get('loader')==='1';
 const frame=document.getElementById('frame');
 frame.width=w; frame.height=h;
 document.getElementById('meta').textContent=w+'×'+h+(hash?' #'+hash:'');
 function fit(){
   const sx=(innerWidth-36)/w, sy=(innerHeight-36)/h;
   const s=Math.min(1,sx,sy);
   const stage=document.getElementById('stage');
   stage.style.width=w+'px'; stage.style.height=h+'px';
   stage.style.transform='scale('+s+')';
 }
 addEventListener('resize',fit); fit();
 let html=await fetch('/?qa-source='+Date.now(),{cache:'no-store'}).then(r=>r.text());
 html=html.replace('<head>','<head><base href="/">');
 html=html.replace('</head>','<style>html{scroll-behavior:auto!important}'+(motion?'*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}':'')+'</style></head>');
 if(!loader){
   html=html.replace('<body>','<body><style>#site-loader{display:none!important}html.is-loading,html.is-loading body{overflow:auto!important}</style><script>window.__RJ_LOADER_STARTED_AT__=-1e9;document.documentElement.classList.remove("is-loading");document.documentElement.classList.add("site-ready","site-entered","site-settled");<\/script>');
 }
 frame.srcdoc=html;
 frame.onload=()=>{
   try{
     const win=frame.contentWindow;
     if(hash) win.location.hash=hash;
     if(y) setTimeout(()=>win.scrollTo(0,y),350);
   }catch(e){}
 };
})();
</script>
</body>
</html>
