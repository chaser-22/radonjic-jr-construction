<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Radonjic JR Construction — gruba gradnja, temelji, beton, zidanje, krovovi, ograde i pripremni radovi. Od temelja do krova." />
  <meta property="og:title" content="Radonjic JR Construction — Od temelja do krova" />
  <meta property="og:description" content="Pouzdana gradnja, jasna izvedba i rezultat koji se vidi u svakoj fazi." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <title>Radonjic JR Construction — Od temelja do krova</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <style id="loader-critical">
    html.is-loading,html.is-loading body{overflow:hidden}
    #site-loader{position:fixed;inset:0;z-index:9999;overflow:hidden;background:#0d0e0c;color:#f7f5ef;font-family:Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .24s ease,visibility .24s ease}
    #site-loader.loader-out,#site-loader.loader-timeout{opacity:0;visibility:hidden;pointer-events:none}
    #site-loader:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:64px 64px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),transparent 92%)}
    #site-loader:after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:linear-gradient(90deg,transparent,rgba(242,182,0,.14),transparent);transform:translateY(-1px)}
    #site-loader .loader-shell{position:relative;z-index:1;width:min(1120px,calc(100vw - 72px));height:100%;margin:auto;display:grid;grid-template-columns:minmax(280px,.72fr) minmax(420px,1.28fr);grid-template-rows:1fr auto;gap:26px 70px;align-items:center;padding:clamp(42px,7vh,88px) 0}
    #site-loader .loader-copy{align-self:center}
    #site-loader .loader-brand{display:flex;align-items:center;gap:15px}
    #site-loader .loader-mark{width:70px;height:70px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.72);font-weight:900;font-size:21px;letter-spacing:-.08em;position:relative}
    #site-loader .loader-mark:after{content:"";position:absolute;width:10px;height:10px;right:-5px;bottom:-5px;background:#f2b600}
    #site-loader .loader-brand-copy{display:grid;gap:4px}
    #site-loader .loader-brand-copy strong{font-size:13px;letter-spacing:.025em}
    #site-loader .loader-brand-copy span{font-size:8px;letter-spacing:.17em;color:#9da199}
    #site-loader .loader-kicker{margin:54px 0 0;font-size:8px;letter-spacing:.18em;color:#9da199}
    #site-loader .loader-title{margin:13px 0 0;font-size:clamp(42px,5vw,72px);line-height:.88;letter-spacing:-.065em;font-weight:800;text-transform:uppercase}
    #site-loader .loader-title span,#site-loader .loader-title em{display:block}
    #site-loader .loader-title em{font-style:normal;color:#f2b600}
    #site-loader .loader-statusline{margin-top:34px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);display:flex;justify-content:space-between;gap:20px;font-size:9px;letter-spacing:.13em;color:#aeb2aa}
    #site-loader .loader-value{color:#f2b600;font-variant-numeric:tabular-nums}
    #site-loader .loader-build{position:relative;min-height:400px;display:grid;place-items:center}
    #site-loader .loader-build:before{content:"BUILD SEQUENCE / 04.0 SEC";position:absolute;top:4%;right:0;font-size:8px;letter-spacing:.16em;color:#777c74}
    #site-loader .loader-house{width:min(100%,650px);overflow:visible}
    #site-loader .loader-house .frame,#site-loader .loader-house .detail{fill:none;stroke:#e8e9e3;stroke-width:1.35;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
    #site-loader .loader-house .accent{stroke:#f2b600}
    #site-loader .loader-house .ghost{stroke:rgba(255,255,255,.15);stroke-width:.7}
    #site-loader .loader-house .ground{animation:rj-draw .48s .20s forwards}
    #site-loader .loader-house .foundation{animation:rj-draw .60s .52s forwards}
    #site-loader .loader-house .column{animation:rj-draw .58s .92s forwards}
    #site-loader .loader-house .beam{animation:rj-draw .52s 1.34s forwards}
    #site-loader .loader-house .wall{animation:rj-draw .68s 1.72s forwards}
    #site-loader .loader-house .upper{animation:rj-draw .58s 2.18s forwards}
    #site-loader .loader-house .roof{animation:rj-draw .72s 2.62s forwards}
    #site-loader .loader-house .detail{animation:rj-draw .42s 3.16s forwards}
    #site-loader .loader-scan{position:absolute;left:8%;right:5%;height:1px;top:18%;background:linear-gradient(90deg,transparent,#f2b600 20%,#f2b600 80%,transparent);opacity:.55;box-shadow:0 0 18px rgba(242,182,0,.18);animation:rj-scan 3.35s .28s cubic-bezier(.2,.72,.18,1) forwards}
    #site-loader .loader-footer{grid-column:1/-1;align-self:end}
    #site-loader .loader-track{height:2px;background:rgba(255,255,255,.11);overflow:hidden}
    #site-loader .loader-bar{height:100%;width:var(--loader-progress,0%);background:#f2b600;box-shadow:0 0 18px rgba(242,182,0,.22);transition:width .12s linear}
    #site-loader .loader-phases{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;font-size:8px;letter-spacing:.12em;color:#6f746d}
    #site-loader .loader-phases span:nth-child(2),#site-loader .loader-phases span:nth-child(3){text-align:center}
    #site-loader .loader-phases span:last-child{text-align:right}
    @keyframes rj-draw{to{stroke-dashoffset:0}}
    @keyframes rj-scan{0%{top:78%;opacity:0}12%{opacity:.58}88%{opacity:.58}100%{top:22%;opacity:0}}
    @media(max-width:760px){
      #site-loader:before{background-size:42px 42px}
      #site-loader .loader-shell{width:calc(100vw - 40px);grid-template-columns:1fr;grid-template-rows:auto 1fr auto;gap:16px;padding:calc(28px + env(safe-area-inset-top)) 0 calc(26px + env(safe-area-inset-bottom))}
      #site-loader .loader-copy{align-self:start}
      #site-loader .loader-mark{width:58px;height:58px;font-size:18px}
      #site-loader .loader-kicker{margin-top:26px}
      #site-loader .loader-title{font-size:clamp(40px,12.5vw,58px)}
      #site-loader .loader-statusline{margin-top:20px}
      #site-loader .loader-build{min-height:0;height:min(37vh,330px)}
      #site-loader .loader-build:before{top:0;font-size:7px}
      #site-loader .loader-house{width:112%;max-width:560px}
      #site-loader .loader-phases{font-size:7px}
    }
    @media(orientation:landscape) and (max-height:560px){
      #site-loader .loader-shell{grid-template-columns:minmax(250px,.8fr) minmax(360px,1.2fr);grid-template-rows:1fr auto;gap:10px 36px;padding:24px 0}
      #site-loader .loader-kicker{margin-top:18px}
      #site-loader .loader-title{font-size:clamp(34px,6vw,52px)}
      #site-loader .loader-statusline{margin-top:16px}
      #site-loader .loader-build{height:68vh;min-height:250px}
      #site-loader .loader-footer{grid-column:1/-1}
    }
    @media(prefers-reduced-motion:reduce){
      #site-loader .loader-house .frame,#site-loader .loader-house .detail{stroke-dashoffset:0;animation:none}
      #site-loader .loader-scan{display:none}
      #site-loader .loader-bar{transition:none}
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-loader" aria-hidden="true" style="--loader-progress:0%">
    <div class="loader-shell">
      <div class="loader-copy">
        <div class="loader-brand">
          <div class="loader-mark">RJ</div>
          <div class="loader-brand-copy">
            <strong>RADONJIC JR</strong>
            <span>CONSTRUCTION</span>
          </div>
        </div>
        <p class="loader-kicker">GRADNJA / KONSTRUKCIJA / IZVEDBA</p>
        <h2 class="loader-title"><span>OD TEMELJA</span><em>DO KROVA.</em></h2>
        <div class="loader-statusline">
          <span data-loader-status>PRIPREMA TERENA</span>
          <span class="loader-value" data-loader-value>000%</span>
        </div>
      </div>

      <div class="loader-build" aria-hidden="true">
        <span class="loader-scan"></span>
        <svg class="loader-house" viewBox="0 0 640 390" role="presentation">
          <path class="frame ghost" pathLength="1" d="M68 328H574M96 328V345M546 328V345M170 72V328M470 72V328M320 28V328"/>
          <path class="frame accent ground" pathLength="1" d="M82 326H560"/>
          <path class="frame foundation" pathLength="1" d="M126 300H514L548 326H92Z"/>
          <path class="frame foundation" pathLength="1" d="M146 280H494V300H146Z"/>
          <path class="frame column" pathLength="1" d="M166 280V190M278 280V190M390 280V190M474 280V190"/>
          <path class="frame beam" pathLength="1" d="M154 190H486M164 178H476"/>
          <path class="frame wall" pathLength="1" d="M178 280V204H266V280M290 280V204H378V280M402 280V204H462V280"/>
          <path class="frame upper column" pathLength="1" d="M190 178V105M310 178V105M450 178V105"/>
          <path class="frame upper beam" pathLength="1" d="M180 105H460"/>
          <path class="frame accent roof" pathLength="1" d="M146 106L320 30L494 106"/>
          <path class="frame roof" pathLength="1" d="M174 106L320 48L466 106M196 96V168M444 96V168"/>
          <path class="detail" pathLength="1" d="M205 224H249V272H205ZM315 218H361V260H315ZM408 218H450V260H408M296 121H344V164H296"/>
          <path class="detail accent" pathLength="1" d="M510 280V326M532 280V326M502 280H540"/>
        </svg>
      </div>

      <div class="loader-footer">
        <div class="loader-track"><div class="loader-bar"></div></div>
        <div class="loader-phases">
          <span>01 / TEMELJI</span>
          <span>02 / KONSTRUKCIJA</span>
          <span>03 / ZIDOVI</span>
          <span>04 / KROV</span>
        </div>
      </div>
    </div>
  </div>
  <script>
    window.__RJ_LOADER_STARTED_AT__ = performance.now();
    document.documentElement.classList.add("is-loading");
    window.__RJ_LOADER_TIMEOUT__ = setTimeout(function () {
      var el = document.getElementById("site-loader");
      if (el) el.classList.add("loader-timeout");
      document.documentElement.classList.remove("is-loading");
      document.documentElement.classList.add("site-ready");
    }, 4600);
  </script>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
