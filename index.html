<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Radonjic JR Construction — gruba gradnja, temelji, beton, zidanje, krovovi, ograde i pripremni radovi. Od temelja do krova." />
  <meta property="og:title" content="Radonjic JR Construction — Od temelja do krova" />
  <meta property="og:description" content="Pouzdana gradnja, jasna izvedba i rezultat koji se vidi u svakoj fazi." />

  <title>Radonjic JR Construction — Od temelja do krova</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <style id="loader-critical">
    html.is-loading,html.is-loading body{overflow:hidden}
    #site-loader{position:fixed;inset:0;z-index:9999;display:block;overflow:hidden;background:#0d0e0c;color:#f7f5ef;font-family:Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .32s ease,visibility .32s ease}
    #site-loader.loader-out,#site-loader.loader-timeout{opacity:0;visibility:hidden;pointer-events:none}
    #site-loader:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 47%,rgba(255,255,255,.042),transparent 48%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,72px 72px,72px 72px;mask-image:linear-gradient(to bottom,transparent 0%,#000 16%,#000 90%,transparent 100%)}
    #site-loader .loader-core{position:relative;z-index:1;width:100%;height:100dvh;min-height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr) auto;justify-items:stretch;align-items:stretch;gap:0;padding:24px 24px calc(22px + env(safe-area-inset-bottom))}
    #site-loader .loader-mark{position:relative;z-index:4;justify-self:center;width:min(560px,92vw);min-height:82px;padding:8px 32px 14px;display:grid;place-items:center;gap:5px;text-align:center;opacity:.99}
    #site-loader .loader-mark:before{content:"";position:absolute;left:50%;bottom:0;width:min(420px,78vw);height:1px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,rgba(255,255,255,.16) 20%,rgba(255,255,255,.16) 80%,transparent);pointer-events:none}
    #site-loader .loader-mark:after{content:"";position:absolute;left:50%;bottom:-1px;width:82px;height:3px;transform:translateX(-50%);background:#f2b600;box-shadow:0 0 20px rgba(242,182,0,.34)}
    #site-loader .loader-mark strong{display:block;font-family:"Manrope",Arial,sans-serif;font-size:38px;line-height:1;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:#f7f5ef;text-shadow:0 8px 28px rgba(0,0,0,.24)}
    #site-loader .loader-mark span{display:block;margin-top:5px;font-family:"IBM Plex Mono",monospace;font-size:11px;line-height:1.2;font-weight:600;letter-spacing:.30em;text-transform:uppercase;color:#aeb2aa}
    #site-loader .loader-build{position:relative;width:100%;height:100%;min-height:0;display:grid;place-items:center;overflow:hidden;margin-top:8px;margin-bottom:14px}
    #site-loader .loader-three{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .24s ease}
    #site-loader.loader-three-ready .loader-three{opacity:1}
    #site-loader .loader-house{width:min(80vw,750px);max-height:78vh;overflow:visible;filter:drop-shadow(0 20px 48px rgba(0,0,0,.24));transform:translateY(-8px) scale(1);opacity:1;transition:transform .42s cubic-bezier(.2,.72,.18,1),opacity .28s ease}
    #site-loader.loader-three-ready .loader-house{opacity:0}
    #site-loader.loader-out .loader-house{transform:translateY(-18px) scale(.94);opacity:0}
    #site-loader .loader-house .frame,#site-loader .loader-house .detail{fill:none;stroke:#e7e8e2;stroke-width:1.45;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
    #site-loader .loader-house .accent{stroke:#f2b600}
    #site-loader .loader-house .ghost{stroke:rgba(255,255,255,.10);stroke-width:.65;stroke-dashoffset:0}
    #site-loader .loader-house .ground{animation:rj-draw .40s .15s forwards}
    #site-loader .loader-house .foundation{animation:rj-draw .50s .50s forwards}
    #site-loader .loader-house .column{animation:rj-draw .56s .92s forwards}
    #site-loader .loader-house .beam{animation:rj-draw .48s 1.42s forwards}
    #site-loader .loader-house .wall{animation:rj-draw .60s 1.82s forwards}
    #site-loader .loader-house .upper{animation:rj-draw .52s 2.30s forwards}
    #site-loader .loader-house .roof{animation:rj-draw .65s 2.68s forwards}
    #site-loader .loader-house .detail{animation:rj-draw .42s 3.20s forwards}
    #site-loader .loader-progress{position:relative;z-index:5;width:100%;display:grid;gap:12px;padding:0 2px}
    #site-loader .loader-progress-head{display:flex;align-items:center;justify-content:space-between;gap:18px;font-family:"IBM Plex Mono",monospace;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase}
    #site-loader .loader-phase{color:#c9ccc5;transition:color .2s ease}
    #site-loader .loader-value{color:#f2b600;font-variant-numeric:tabular-nums}
    #site-loader .loader-track{position:relative;width:100%;height:20px;padding:3px;border:1px solid rgba(255,255,255,.16);border-radius:4px;background:rgba(255,255,255,.035);overflow:hidden;box-shadow:inset 0 1px 6px rgba(0,0,0,.34),0 12px 36px rgba(0,0,0,.18)}
    #site-loader .loader-track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.12) calc(10% - 1px),rgba(255,255,255,.12) 10%);opacity:.34;pointer-events:none}
    #site-loader .loader-bar{position:relative;height:100%;width:var(--loader-progress,0%);border-radius:2px;background:linear-gradient(90deg,#a87c00 0%,#f2b600 62%,#ffd85b 100%);box-shadow:0 0 18px rgba(242,182,0,.30),0 0 4px rgba(255,216,91,.42);transition:width .08s linear;overflow:hidden}
    #site-loader .loader-bar:after{content:"";position:absolute;top:0;right:-24px;width:42px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);transform:skewX(-22deg);animation:rj-loader-sheen 1.15s ease-in-out infinite}
    @keyframes rj-draw{to{stroke-dashoffset:0}}
    @keyframes rj-loader-sheen{0%{transform:translateX(-18px) skewX(-22deg);opacity:.2}55%{opacity:.95}100%{transform:translateX(42px) skewX(-22deg);opacity:.15}}
    @media(max-width:760px){
      #site-loader:before{background-size:auto,48px 48px,48px 48px}
      #site-loader .loader-core{width:100%;height:100dvh;min-height:100vh;padding:16px max(12px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));gap:0}
      #site-loader .loader-mark{width:min(400px,96vw);min-height:66px;padding:6px 14px 11px}
      #site-loader .loader-mark strong{font-size:27px;letter-spacing:.04em}
      #site-loader .loader-mark span{margin-top:4px;font-size:8.5px;letter-spacing:.22em}
      #site-loader .loader-mark:before{width:min(320px,80vw)}
      #site-loader .loader-mark:after{width:60px;height:3px}
      #site-loader .loader-build{height:100%;min-height:0;margin-top:4px;margin-bottom:10px}
      #site-loader .loader-house{width:min(84vw,560px);max-width:none;max-height:66dvh}
      #site-loader .loader-progress{width:100%;padding:0}
      #site-loader .loader-progress-head{font-size:9px;letter-spacing:.12em}
      #site-loader .loader-track{height:16px;padding:2px}
    }
    @media(orientation:landscape) and (max-height:560px){
      #site-loader .loader-core{gap:0;padding-top:10px;padding-bottom:10px}
      #site-loader .loader-mark{width:min(360px,76vw);min-height:48px;padding:3px 12px 8px}
      #site-loader .loader-mark strong{font-size:22px}
      #site-loader .loader-mark span{font-size:7.5px}
      #site-loader .loader-build{height:100%;min-height:0;margin-top:2px;margin-bottom:6px}
      #site-loader .loader-house{width:min(73vw,560px);max-height:60vh}
    }
    @media(prefers-reduced-motion:reduce){
      #site-loader .loader-house .frame,#site-loader .loader-house .detail{stroke-dashoffset:0;animation:none}
      #site-loader .loader-bar{transition:none}
      #site-loader .loader-bar:after{animation:none}
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-loader" aria-hidden="true" style="--loader-progress:0%">
    <div class="loader-core">
      <div class="loader-mark" aria-label="Radonjic JR Construction">
        <strong>RADONJIC JR</strong>
        <span>CONSTRUCTION</span>
      </div>
      <div class="loader-build" aria-hidden="true">
        <canvas class="loader-three" data-loader-three></canvas>
        <svg class="loader-house" viewBox="0 0 700 390" role="presentation">
          <path class="frame ghost" pathLength="1" d="M64 330H636M96 330V344M604 330V344M158 156V320M542 156V320M350 76V320"/>
          <path class="frame accent ground" pathLength="1" d="M78 330H622"/>
          <path class="frame foundation" pathLength="1" d="M92 302H608L632 330H68Z"/>
          <path class="frame foundation" pathLength="1" d="M116 280H584V302H116Z"/>

          <path class="frame column" pathLength="1" d="M158 280V198M350 280V198M542 280V198"/>
          <path class="frame beam" pathLength="1" d="M144 198H556M158 184H542"/>

          <path class="frame wall" pathLength="1" d="M132 280V212H188V280M208 280V212H316V280M384 280V212H492V280M512 280V212H568V280"/>
          <path class="detail" pathLength="1" d="M220 222H304V268H220ZM396 222H480V268H396ZM326 218H374V280"/>

          <path class="frame upper column" pathLength="1" d="M158 184V132M350 184V132M542 184V132"/>
          <path class="frame upper beam" pathLength="1" d="M144 132H556"/>
          <path class="frame wall upper" pathLength="1" d="M176 184V144H300V184M400 184V144H524V184"/>
          <path class="detail" pathLength="1" d="M202 151H278V176H202ZM422 151H498V176H422"/>

          <path class="frame accent roof" pathLength="1" d="M112 138L350 70L588 138"/>
          <path class="frame roof" pathLength="1" d="M134 138L350 82L566 138M112 138H588"/>
          <path class="detail accent" pathLength="1" d="M315 120H385V126"/>
          <path class="detail" pathLength="1" d="M317 280V211H383V280M298 206H402V216"/>
        </svg>
      </div>
      <div class="loader-progress">
        <div class="loader-progress-head">
          <span class="loader-phase" data-loader-phase>PRIPREMA</span>
          <span class="loader-value" data-loader-value>000%</span>
        </div>
        <div class="loader-track"><div class="loader-bar"></div></div>
      </div>
    </div>
  </div>
  <script>
    window.__RJ_LOADER_STARTED_AT__ = performance.now();
    document.documentElement.classList.add("is-loading");
    window.__RJ_LOADER_TIMEOUT__ = setTimeout(function () {
      var el = document.getElementById("site-loader");
      if (el) el.classList.add("loader-timeout");
      document.documentElement.classList.remove("is-loading");
      document.documentElement.classList.add("site-ready");
      document.documentElement.classList.add("site-entered");
    }, 4800);
  </script>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
