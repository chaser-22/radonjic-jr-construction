<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Radonjic JR Construction — gruba gradnja, temelji, beton, zidanje, krovovi, ograde i pripremni radovi. Od temelja do krova." />
  <meta property="og:title" content="Radonjic JR Construction — Od temelja do krova" />
  <meta property="og:description" content="Pouzdana gradnja, jasna izvedba i rezultat koji se vidi u svakoj fazi." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary" />
  <title>Radonjic JR Construction — Od temelja do krova</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <style id="loader-critical">
    #site-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#10110f;color:#f7f5ef;font-family:Arial,sans-serif;transition:opacity .62s ease,visibility .62s ease}
    #site-loader.loader-out,#site-loader.loader-timeout{opacity:0;visibility:hidden;pointer-events:none}
    #site-loader .loader-inner{width:min(420px,calc(100vw - 48px))}
    #site-loader .loader-mark{width:78px;height:78px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.75);font-weight:900;font-size:24px;letter-spacing:-.08em;position:relative}
    #site-loader .loader-mark:after{content:"";position:absolute;width:11px;height:11px;right:-6px;bottom:-6px;background:#f2b600}
    #site-loader .loader-name{margin:24px 0 0;font-size:13px;font-weight:800;letter-spacing:.04em}
    #site-loader .loader-meta{margin:6px 0 0;font-size:9px;letter-spacing:.16em;color:#aeb2aa}
    #site-loader .loader-track{height:1px;margin-top:34px;background:rgba(255,255,255,.14);overflow:hidden}
    #site-loader .loader-bar{height:100%;width:var(--loader-progress,8%);background:#f2b600;transition:width .35s cubic-bezier(.2,.72,.18,1)}
    #site-loader .loader-row{display:flex;justify-content:space-between;gap:20px;margin-top:12px;font-size:9px;letter-spacing:.12em;color:#aeb2aa}
    #site-loader .loader-value{color:#f2b600}
    @media(max-width:760px){#site-loader{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}#site-loader .loader-inner{width:calc(100vw - 40px)}#site-loader .loader-mark{width:64px;height:64px;font-size:20px}}
    @media(prefers-reduced-motion:reduce){#site-loader,#site-loader .loader-bar{transition:none}}
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-loader" aria-hidden="true" style="--loader-progress:8%">
    <div class="loader-inner">
      <div class="loader-mark">RJ</div>
      <p class="loader-name">RADONJIC JR CONSTRUCTION</p>
      <p class="loader-meta">OD TEMELJA DO KROVA</p>
      <div class="loader-track"><div class="loader-bar"></div></div>
      <div class="loader-row"><span data-loader-status>PRIPREMA</span><span class="loader-value" data-loader-value>008%</span></div>
    </div>
  </div>
  <script>
    window.__RJ_LOADER_TIMEOUT__ = setTimeout(function () {
      var el = document.getElementById("site-loader");
      if (el) el.classList.add("loader-timeout");
    }, 4200);
  </script>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
