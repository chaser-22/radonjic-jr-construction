<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Radonjic JR Construction — gruba gradnja, temelji, beton, zidanje, krovovi, ograde i pripremni radovi. Od temelja do krova." />
  <meta property="og:title" content="Radonjic JR Construction — Od temelja do krova" />
  <meta property="og:description" content="Pouzdana gradnja, jasna izvedba i rezultat koji se vidi u svakoj fazi." />

  <title>Radonjic JR Construction — Od temelja do krova</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <style id="loader-critical">
    html.is-loading,html.is-loading body{overflow:hidden}
    #site-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#0d0e0c;color:#f7f5ef;font-family:Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .32s ease,visibility .32s ease}
    #site-loader.loader-out,#site-loader.loader-timeout{opacity:0;visibility:hidden;pointer-events:none}
    #site-loader:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.028),transparent 42%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,72px 72px,72px 72px;mask-image:linear-gradient(to bottom,transparent 2%,#000 24%,#000 76%,transparent 98%)}
    #site-loader .loader-core{position:relative;z-index:1;width:min(620px,calc(100vw - 44px));display:grid;justify-items:center;gap:24px}
    #site-loader .loader-mark{width:50px;height:50px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.52);font-weight:900;font-size:16px;letter-spacing:-.08em;position:relative;opacity:.82}
    #site-loader .loader-mark:after{content:"";position:absolute;width:7px;height:7px;right:-4px;bottom:-4px;background:#f2b600}
    #site-loader .loader-build{position:relative;width:100%;height:min(46vh,390px);min-height:260px;display:grid;place-items:center}
    #site-loader .loader-house{width:min(100%,570px);overflow:visible;filter:drop-shadow(0 16px 40px rgba(0,0,0,.20))}
    #site-loader .loader-house .frame,#site-loader .loader-house .detail{fill:none;stroke:#e7e8e2;stroke-width:1.45;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
    #site-loader .loader-house .accent{stroke:#f2b600}
    #site-loader .loader-house .ghost{stroke:rgba(255,255,255,.10);stroke-width:.65;stroke-dashoffset:0}
    #site-loader .loader-house .ground{animation:rj-draw .52s .25s forwards}
    #site-loader .loader-house .foundation{animation:rj-draw .68s .68s forwards}
    #site-loader .loader-house .column{animation:rj-draw .72s 1.28s forwards}
    #site-loader .loader-house .beam{animation:rj-draw .62s 1.92s forwards}
    #site-loader .loader-house .wall{animation:rj-draw .78s 2.42s forwards}
    #site-loader .loader-house .upper{animation:rj-draw .68s 3.08s forwards}
    #site-loader .loader-house .roof{animation:rj-draw .82s 3.55s forwards}
    #site-loader .loader-house .detail{animation:rj-draw .56s 4.18s forwards}
    #site-loader .loader-progress{width:min(430px,82vw)}
    #site-loader .loader-track{height:2px;background:rgba(255,255,255,.11);overflow:hidden}
    #site-loader .loader-bar{height:100%;width:var(--loader-progress,0%);background:#f2b600;box-shadow:0 0 16px rgba(242,182,0,.18);transition:width .08s linear}
    #site-loader .loader-value{display:block;margin-top:9px;text-align:right;color:#858a82;font-size:8px;letter-spacing:.12em;font-variant-numeric:tabular-nums}
    @keyframes rj-draw{to{stroke-dashoffset:0}}
    @media(max-width:760px){
      #site-loader:before{background-size:auto,48px 48px,48px 48px}
      #site-loader .loader-core{width:calc(100vw - 28px - env(safe-area-inset-left) - env(safe-area-inset-right));gap:14px}
      #site-loader .loader-mark{width:44px;height:44px;font-size:14px}
      #site-loader .loader-build{height:min(38dvh,300px);min-height:220px}
      #site-loader .loader-house{width:106%;max-width:500px}
      #site-loader .loader-progress{width:min(330px,80vw)}
    }
    @media(orientation:landscape) and (max-height:560px){
      #site-loader .loader-core{gap:10px}
      #site-loader .loader-mark{width:40px;height:40px;font-size:13px}
      #site-loader .loader-build{height:58vh;min-height:210px}
      #site-loader .loader-house{width:min(74vw,500px)}
    }
    @media(prefers-reduced-motion:reduce){
      #site-loader .loader-house .frame,#site-loader .loader-house .detail{stroke-dashoffset:0;animation:none}
      #site-loader .loader-bar{transition:none}
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-loader" aria-hidden="true" style="--loader-progress:0%">
    <div class="loader-core">
      <div class="loader-mark">RJ</div>
      <div class="loader-build" aria-hidden="true">
        <svg class="loader-house" viewBox="0 0 640 390" role="presentation">
          <path class="frame ghost" pathLength="1" d="M68 328H574M96 328V345M546 328V345M170 72V328M470 72V328M320 28V328"/>
          <path class="frame accent ground" pathLength="1" d="M82 326H560"/>
          <path class="frame foundation" pathLength="1" d="M126 300H514L548 326H92Z"/>
          <path class="frame foundation" pathLength="1" d="M146 280H494V300H146Z"/>
          <path class="frame column" pathLength="1" d="M166 280V190M278 280V190M390 280V190M474 280V190"/>
          <path class="frame beam" pathLength="1" d="M154 190H486M164 178H476"/>
          <path class="frame wall" pathLength="1" d="M178 280V204H266V280M290 280V204H378V280M402 280V204H462V280"/>
          <path class="frame upper column" pathLength="1" d="M190 178V105M310 178V105M450 178V105"/>
          <path class="frame upper beam" pathLength="1" d="M180 105H460"/>
          <path class="frame accent roof" pathLength="1" d="M146 106L320 30L494 106"/>
          <path class="frame roof" pathLength="1" d="M174 106L320 48L466 106M196 96V168M444 96V168"/>
          <path class="detail" pathLength="1" d="M205 224H249V272H205ZM315 218H361V260H315ZM408 218H450V260H408M296 121H344V164H296"/>
          <path class="detail accent" pathLength="1" d="M510 280V326M532 280V326M502 280H540"/>
        </svg>
      </div>
      <div class="loader-progress">
        <div class="loader-track"><div class="loader-bar"></div></div>
        <span class="loader-value" data-loader-value>000%</span>
      </div>
    </div>
  </div>
  <script>
    window.__RJ_LOADER_STARTED_AT__ = performance.now();
    document.documentElement.classList.add("is-loading");
    window.__RJ_LOADER_TIMEOUT__ = setTimeout(function () {
      var el = document.getElementById("site-loader");
      if (el) el.classList.add("loader-timeout");
      document.documentElement.classList.remove("is-loading");
      document.documentElement.classList.add("site-ready");
    }, 5800);
  </script>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
