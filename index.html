<!doctype html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#10110f" />
  <meta name="description" content="Radonjic JR Construction — gruba gradnja, temelji, beton, zidanje, krovovi, ograde i pripremni radovi. Od temelja do krova." />
  <meta property="og:title" content="Radonjic JR Construction — Od temelja do krova" />

  <title>Radonjic JR Construction — Od temelja do krova</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://images.pexels.com" />
  <style id="loader-critical">
    html.is-loading,html.is-loading body{overflow:hidden}
    #site-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#0d0e0c;color:#f7f5ef;font-family:Arial,sans-serif;opacity:1;visibility:visible;transition:opacity .32s ease,visibility .32s ease}
    #site-loader.loader-out,#site-loader.loader-timeout{opacity:0;visibility:hidden;pointer-events:none}
    #site-loader:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,255,255,.028),transparent 42%),linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:auto,72px 72px,72px 72px;mask-image:linear-gradient(to bottom,transparent 2%,#000 24%,#000 76%,transparent 98%)}
    #site-loader .loader-core{position:relative;z-index:1;width:min(620px,calc(100vw - 44px));display:grid;justify-items:center;gap:24px}
    #site-loader .loader-mark{width:76px;height:76px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.60);background:rgba(255,255,255,.018);box-shadow:inset 0 0 0 6px rgba(255,255,255,.018),0 16px 46px rgba(0,0,0,.22);font-weight:900;font-size:23px;letter-spacing:-.08em;position:relative;opacity:.96}
    #site-loader .loader-mark:before{content:"";position:absolute;inset:7px;border:1px solid rgba(255,255,255,.10);pointer-events:none}
    #site-loader .loader-mark:after{content:"";position:absolute;width:11px;height:11px;right:-5px;bottom:-5px;background:#f2b600;box-shadow:0 0 20px rgba(242,182,0,.34)}
    #site-loader .loader-build{position:relative;width:100%;height:min(46vh,390px);min-height:260px;display:grid;place-items:center}
    #site-loader .loader-three{position:absolute;inset:0;width:100%;height:100%;display:block;opacity:0;transition:opacity .24s ease}
    #site-loader.loader-three-ready .loader-three{opacity:1}
    #site-loader .loader-house{width:min(100%,570px);overflow:visible;filter:drop-shadow(0 16px 40px rgba(0,0,0,.20));transform:translateY(0) scale(1);opacity:1;transition:transform .42s cubic-bezier(.2,.72,.18,1),opacity .28s ease}
    #site-loader.loader-three-ready .loader-house{opacity:0}
    #site-loader.loader-out .loader-house{transform:translateY(-10px) scale(.94);opacity:0}
    #site-loader .loader-house .frame,#site-loader .loader-house .detail{fill:none;stroke:#e7e8e2;stroke-width:1.45;vector-effect:non-scaling-stroke;stroke-dasharray:1;stroke-dashoffset:1}
    #site-loader .loader-house .accent{stroke:#f2b600}
    #site-loader .loader-house .ghost{stroke:rgba(255,255,255,.10);stroke-width:.65;stroke-dashoffset:0}
    #site-loader .loader-house .ground{animation:rj-draw .40s .15s forwards}
    #site-loader .loader-house .foundation{animation:rj-draw .50s .50s forwards}
    #site-loader .loader-house .column{animation:rj-draw .56s .92s forwards}
    #site-loader .loader-house .beam{animation:rj-draw .48s 1.42s forwards}
    #site-loader .loader-house .wall{animation:rj-draw .60s 1.82s forwards}
    #site-loader .loader-house .upper{animation:rj-draw .52s 2.30s forwards}
    #site-loader .loader-house .roof{animation:rj-draw .65s 2.68s forwards}
    #site-loader .loader-house .detail{animation:rj-draw .42s 3.20s forwards}
    #site-loader .loader-progress{width:min(470px,84vw);display:grid;gap:9px}
    #site-loader .loader-progress-head{display:flex;align-items:center;justify-content:space-between;gap:18px;font-family:"IBM Plex Mono",monospace;font-size:9px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}
    #site-loader .loader-phase{color:#c9ccc5;transition:color .2s ease}
    #site-loader .loader-value{color:#f2b600;font-variant-numeric:tabular-nums}
    #site-loader .loader-track{position:relative;height:9px;padding:2px;border:1px solid rgba(255,255,255,.13);border-radius:999px;background:rgba(255,255,255,.035);overflow:hidden;box-shadow:inset 0 1px 5px rgba(0,0,0,.30),0 8px 26px rgba(0,0,0,.12)}
    #site-loader .loader-track:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),rgba(255,255,255,.12) calc(10% - 1px),rgba(255,255,255,.12) 10%);opacity:.34;pointer-events:none}
    #site-loader .loader-bar{position:relative;height:100%;width:var(--loader-progress,0%);border-radius:999px;background:linear-gradient(90deg,#a87c00 0%,#f2b600 62%,#ffd85b 100%);box-shadow:0 0 18px rgba(242,182,0,.30),0 0 4px rgba(255,216,91,.42);transition:width .08s linear;overflow:hidden}
    #site-loader .loader-bar:after{content:"";position:absolute;top:0;right:-24px;width:42px;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.78),transparent);transform:skewX(-22deg);animation:rj-loader-sheen 1.15s ease-in-out infinite}
    @keyframes rj-draw{to{stroke-dashoffset:0}}
    @keyframes rj-loader-sheen{0%{transform:translateX(-18px) skewX(-22deg);opacity:.2}55%{opacity:.95}100%{transform:translateX(42px) skewX(-22deg);opacity:.15}}
    @media(max-width:760px){
      #site-loader:before{background-size:auto,48px 48px,48px 48px}
      #site-loader .loader-core{width:calc(100vw - 32px - env(safe-area-inset-left) - env(safe-area-inset-right));gap:12px}
      #site-loader .loader-mark{width:62px;height:62px;font-size:19px}
      #site-loader .loader-mark:after{width:9px;height:9px;right:-4px;bottom:-4px}
      #site-loader .loader-build{height:min(34dvh,280px);min-height:205px}
      #site-loader .loader-house{width:100%;max-width:460px}
      #site-loader .loader-progress{width:min(340px,86vw)}
      #site-loader .loader-progress-head{font-size:8px;letter-spacing:.11em}
      #site-loader .loader-track{height:8px}
    }
    @media(orientation:landscape) and (max-height:560px){
      #site-loader .loader-core{gap:10px}
      #site-loader .loader-mark{width:54px;height:54px;font-size:17px}
      #site-loader .loader-build{height:58vh;min-height:210px}
      #site-loader .loader-house{width:min(74vw,500px)}
    }
    @media(prefers-reduced-motion:reduce){
      #site-loader .loader-house .frame,#site-loader .loader-house .detail{stroke-dashoffset:0;animation:none}
      #site-loader .loader-bar{transition:none}
      #site-loader .loader-bar:after{animation:none}
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="site-loader" aria-hidden="true" style="--loader-progress:0%">
    <div class="loader-core">
      <div class="loader-mark">RJ</div>
      <div class="loader-build" aria-hidden="true">
        <canvas class="loader-three" data-loader-three></canvas>
        <svg class="loader-house" viewBox="0 0 640 390" role="presentation">
          <path class="frame ghost" pathLength="1" d="M80 330H560M112 330V344M528 330V344M170 108V330M470 108V330M320 34V330"/>
          <path class="frame accent ground" pathLength="1" d="M96 330H544"/>
          <path class="frame foundation" pathLength="1" d="M120 304H520L544 330H96Z"/>
          <path class="frame foundation" pathLength="1" d="M142 282H498V304H142Z"/>

          <path class="frame column" pathLength="1" d="M172 282V194M268 282V194M372 282V194M468 282V194"/>
          <path class="frame beam" pathLength="1" d="M158 194H482M170 180H470"/>

          <path class="frame wall" pathLength="1" d="M186 282V208H256V282M280 282V208H360V282M384 282V208H454V282"/>
          <path class="detail" pathLength="1" d="M198 220H244V268H198ZM296 216H344V282H296ZM396 220H442V268H396"/>

          <path class="frame upper column" pathLength="1" d="M200 180V112M320 180V112M440 180V112"/>
          <path class="frame upper beam" pathLength="1" d="M184 112H456"/>
          <path class="frame wall upper" pathLength="1" d="M214 180V124H286V180M354 180V124H426V180"/>
          <path class="detail" pathLength="1" d="M226 134H274V168H226ZM366 134H414V168H366"/>

          <path class="frame accent roof" pathLength="1" d="M150 112L320 34L490 112"/>
          <path class="frame roof" pathLength="1" d="M176 112L320 52L464 112M192 104V176M448 104V176"/>
          <path class="detail accent" pathLength="1" d="M302 86H338V112"/>
        </svg>
      </div>
      <div class="loader-progress">
        <div class="loader-progress-head">
          <span class="loader-phase" data-loader-phase>PRIPREMA</span>
          <span class="loader-value" data-loader-value>000%</span>
        </div>
        <div class="loader-track"><div class="loader-bar"></div></div>
      </div>
    </div>
  </div>
  <script>
    window.__RJ_LOADER_STARTED_AT__ = performance.now();
    document.documentElement.classList.add("is-loading");
    window.__RJ_LOADER_TIMEOUT__ = setTimeout(function () {
      var el = document.getElementById("site-loader");
      if (el) el.classList.add("loader-timeout");
      document.documentElement.classList.remove("is-loading");
      document.documentElement.classList.add("site-ready");
      document.documentElement.classList.add("site-entered");
    }, 4800);
  </script>
  <a class="skip-link" href="#main">Preskoči na sadržaj</a>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
